[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipoq"
version = "0.1.0"
description = "Black-box variational quantum search for lipid nanoparticle compositions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.15.3", "torch==2.6.0",
  "qiskit==2.4.2", "qiskit-algorithms==0.4.0", "PyYAML>=6,<7",
  "lmdb>=1.4,<4", "pandas>=2,<4", "scikit-learn>=1.2,<2",
  "tensorboardX>=2.5,<3", "tqdm>=4.64,<5", "rdkit>=2024,<2027",
  "tokenizers>=0.13,<0.24",
]

[project.optional-dependencies]
setup = ["gdown>=5,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
lipoq = "lnp_vqa.cli:main"
lnp-vqa = "lnp_vqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

