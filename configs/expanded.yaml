# Paths are relative to this YAML file. Lipid IDs refer to the pinned COMET mol.lmdb.
seed: 7
comet:
  repo: ../vendor/COMET
  checkpoint: ../artifacts/comet_lipid_fold0.pt
  preprocessing_seed: 0
  batch_size: 16
  cpu_threads: 4
condition:
  cell: DC2.4  # Mouse dendritic cell line; checkpoint also supports B16-F10
  np_ratio: 5.287338420806728  # Fixed process condition, taken from example record 0
  volumetric_ratio: '1:1'
search:
  candidates:
    ionizable: [0, 4, 5, 6, 7, 8, 9] # All seven upstream ionizable molecules
    phospholipid: [1, 13] # DOPE, DSPC
    sterol: [2, 10, 12] # All three upstream sterols; names/SMILES in catalog.json
    peg: [3, 11]        # C14-PEG, C18-PEG (upstream shortened PEG representations)
  ratios:
    denominator: 1000
    bounds:
      ionizable: {min: 0.30, max: 0.55, step: 0.05}
      phospholipid: {min: 0.10, max: 0.25, step: 0.05}
      sterol: {min: 0.15, max: 0.59, step: 0.01}
      peg: {min: 0.01, max: 0.03, step: 0.01}
circuit:
  qubits: auto # Or the exact encoding size; unused qubits are rejected.
  depth: 1    # RY layer, linear CX chain, final RY layer
  shots: 128
optimizer:
  iterations: 12
  learning_rate: 0.05
  perturbation: 0.2
  alpha: 0.602
  gamma: 0.101
  stability_constant: 0
output:
  directory: ../results
  cache: ../artifacts/comet_scores.sqlite
